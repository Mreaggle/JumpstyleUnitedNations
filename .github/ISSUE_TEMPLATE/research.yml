name: Historical research record
description: Propose a sourced event, meeting, person, release or archive recovery.
title: "[Research]: "
labels:
  - research
  - needs-evidence
body:
  - type: dropdown
    id: record_type
    attributes:
      label: Record type
      options:
        - Meeting or event
        - Competition or league
        - Music release
        - Person or crew
        - Forum or community archive
        - Media appearance
        - Other historical record
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country and city
      placeholder: Poland - Krakow
    validations:
      required: true
  - type: input
    id: event_date
    attributes:
      label: Event date
      description: Use unknown when the event date is not stated by a source.
      placeholder: YYYY-MM-DD or unknown
    validations:
      required: true
  - type: input
    id: upload_date
    attributes:
      label: Upload date
      placeholder: YYYY-MM-DD or unknown
  - type: input
    id: source
    attributes:
      label: Public source URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: archived_source
    attributes:
      label: Archived URL
      placeholder: https://web.archive.org/
  - type: textarea
    id: claim
    attributes:
      label: Historical claim
      description: Describe what the source directly supports and identify any inference.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence confirmation
      options:
        - label: This issue contains no private chat text, phone numbers or personal contact data.
          required: true
        - label: I have clearly labeled any use of upload date as an event-date fallback.
          required: true
